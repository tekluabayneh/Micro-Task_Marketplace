apiVersion: apps/v1
kind: Deployment
metadata:
  name: microtask-frontend
  namespace: microtask-app
  labels:
    app: microtask-frontend-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microtask-frontend # only manage this pods 
  template:
    metadata:
      labels:
        app: microtask-frontend # this is the pod labels that let's us to connect to services 
    spec:
      containers:
        - name: microtask-frontend-app
          image: tekluman/micro-client:v4
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: microtask-frontend-secret
          resources:
            limits:
              cpu: "1000m"
              memory: "768Mi"
            requests:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
